name: publish

on:
  push:
    tags:
      - "v*"

# The workflow only ever reads the repository. Upload rights come from the
# short-lived OIDC token minted in the publish job, not from a stored secret.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests tools
      - run: mypy src/astromansion
      - run: pytest tests -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      # The tag names the release, so a tag that disagrees with the version in
      # the source would publish something nobody asked for. Refuse instead.
      - name: Tag must match the package version
        run: |
          version=$(python -c "import tomllib,pathlib,re;\
            src=pathlib.Path('src/astromansion/constants.py').read_text();\
            print(re.search(r'VERSION: Final\[str\] = \"([^\"]+)\"', src).group(1))")
          if [ "refs/tags/v$version" != "$GITHUB_REF" ]; then
            echo "tag $GITHUB_REF does not match version $version" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
